name: Build latest (macOS 32 bit)
# trigger via either push to selected branches or on manual run
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-mac32
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classicube/minimal-osxcross:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Compile 32 bit macOS builds
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"${GITHUB_SHA::9}\"
          COMMON_CFLAGS="-fno-stack-protector $LATEST_FLAG"
          COMMON_LDFLAGS="-s -lgcc_s.1"
 
          PATH=$PATH:/usr/local/compiler/target/bin

          make darwin RELEASE=1 TARGET=cc-mac32-gl1-x86 CC=i386-apple-darwin8-clang \
                EXTRA_CFLAGS="$COMMON_CFLAGS" \
                EXTRA_LDFLAGS="$COMMON_LDFLAGS"

          make darwin clean
          make darwin RELEASE=1 TARGET=cc-mac32-gl2-x86 CC=i386-apple-darwin8-clang \
                EXTRA_CFLAGS="$COMMON_CFLAGS -DCC_GFX_BACKEND=CC_GFX_BACKEND_GL2" \
                EXTRA_LDFLAGS="$COMMON_LDFLAGS"

      - name: Compile 32 bit macOS builds (PowerPC)
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\"${GITHUB_SHA::9}\"
          COMMON_CFLAGS="-fno-stack-protector -isystem /usr/local/compiler/ppc/target/SDK/MacOSX10.5.sdk $LATEST_FLAG"
          COMMON_LDFLAGS="-s -static-libgcc -Wl,-no_compact_unwind -Wl,-syslibroot /usr/local/compiler/ppc/target/SDK/MacOSX10.5.sdk"
 
          mkdir -p /home/minty/repos/osxcross-ppc-test/target/bin
          ln -s /usr/local/compiler/ppc/target/bin/powerpc64-apple-darwin9-as /home/minty/repos/osxcross-ppc-test/target/bin/powerpc64-apple-darwin9-as
          PATH=$PATH:/usr/local/compiler/ppc/target/bin

          make darwin clean
          make darwin RELEASE=1 TARGET=cc-mac32-gl1-ppc CC=powerpc-apple-darwin9-base-gcc \
                EXTRA_CFLAGS="$COMMON_CFLAGS -m32 -mmacosx-version-min=10.2.0" \
                EXTRA_LDFLAGS="$COMMON_LDFLAGS"

      - name: Generate combined Intel + PowerPC build
        shell: bash
        run: |
          PATH=$PATH:/usr/local/compiler/target/bin
          i386-apple-darwin8-lipo -create -output cc-mac32-gl1 cc-mac32-gl1-x86 cc-mac32-gl1-ppc
          cp cc-mac32-gl2-x86 cc-mac32-gl2
          
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'cc-mac32-gl1'
          DEST_NAME: 'ClassiCube-mac32-OpenGL'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'cc-mac32-gl2'
          DEST_NAME: 'ClassiCube-mac32-ModernGL'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'cc-mac32-gl1-x86'
          DEST_NAME: 'ClassiCube-mac32-OpenGL-X86'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'cc-mac32-gl1-ppc'
          DEST_NAME: 'ClassiCube-mac32-OpenGL-PPC'
        
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'mac32'


      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce 32 bit macOS build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
