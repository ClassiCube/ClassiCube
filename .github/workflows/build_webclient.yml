name: Build latest (Webclient)
# run manually, or from the build/release console and build/release all workflows
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-webclient
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: trzeci/emscripten-fastcomp:1.39.0
    steps:
      - uses: actions/checkout@v5
      - name: Compiles webclient
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\\\"${GITHUB_SHA::9}\\\"

          make weblegacy EXTRA_CFLAGS="$LATEST_FLAG"
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube.js'
          DEST_NAME: 'ClassiCube.js'
          
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'webclient'


      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce Webclient'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
