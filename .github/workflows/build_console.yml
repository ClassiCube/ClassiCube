name: Build console
# Builds a single platform (its binaries are uploaded as artifacts of this run)
# NOTE: Also used by release_console.yml
on:
  workflow_dispatch:
    inputs:
      console:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - 3ds
          - android
          - dreamcast
          - freebsd
          - gba
          - gc
          - haiku
          - ios
          - linux
          - mac32
          - mac64
          - macclassic
          - msdos
          - n64
          - nds
          - netbsd
          - ps1
          - ps2
          - ps3
          - psp
          - rpi
          - saturn
          - switch
          - symbian
          - vita
          - webclient
          - wii
          - wiiu
          - win-arm
          - wince
          - windows
          - xbox
          - xbox360
  workflow_call:
    inputs:
      console:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build-console-${{ inputs.console }}
  cancel-in-progress: true

jobs:
  build_3ds:
    name: 3DS
    if: ${{ inputs.console == '3ds' }}
    uses: ./.github/workflows/build_3ds.yml
    secrets: inherit

  build_android:
    name: Android
    if: ${{ inputs.console == 'android' }}
    uses: ./.github/workflows/build_android.yml
    secrets: inherit

  build_dreamcast:
    name: Dreamcast
    if: ${{ inputs.console == 'dreamcast' }}
    uses: ./.github/workflows/build_dreamcast.yml
    secrets: inherit

