name: Build all
# Builds every platform (each platform's binaries are uploaded as artifacts of this run)
# NOTE: Also used by release_all.yml
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build-all
  cancel-in-progress: true

jobs:
