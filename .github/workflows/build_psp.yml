name: Build latest (PSP)
# run manually, or from the build/release console and build/release all workflows
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-psp
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install prerequisites
        run: |
          apk add curl curl-dev

      - name: Compile PSP build
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\\\"${GITHUB_SHA::9}\\\"
          make psp EXTRA_CFLAGS="$LATEST_FLAG"
          
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'EBOOT.PBP'
          DEST_NAME: 'EBOOT.PBP'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-psp.elf'
          DEST_NAME: 'ClassiCube-psp.elf'
          
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'psp'
          

      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce PSP build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
