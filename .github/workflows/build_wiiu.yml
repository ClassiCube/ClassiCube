name: Build latest (WiiU)
# run manually, or from the build/release console and build/release all workflows
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-wiiu
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile Wii U build
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\\\"${GITHUB_SHA::9}\\\"
          make wiiu EXTRA_CFLAGS="$LATEST_FLAG"
          
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-wiiu.wuhb'
          DEST_NAME: 'ClassiCube-wiiu.wuhb'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-wiiu.rpx'
          DEST_NAME: 'ClassiCube-wiiu.rpx'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-wiiu.elf'
          DEST_NAME: 'ClassiCube-wiiu.elf'
          
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'wiiu'


      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce WiiU build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
