name: Build latest (Xbox 360)
# trigger via either push to selected branches or on manual run
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-xbox360
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/classicube/minimal-xsdk:latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile 360 build
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\\\"${GITHUB_SHA::9}\\\"
          make xbox360 EXTRA_CFLAGS="$LATEST_FLAG"
          
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-xbox360.elf'
          DEST_NAME: 'ClassiCube-xbox360.elf'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-xbox360.xex'
          DEST_NAME: 'ClassiCube-xbox360.xex'
          
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'xbox360'


      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce Xbox 360 build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
