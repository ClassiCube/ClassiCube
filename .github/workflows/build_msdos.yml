name: Build latest (MS DOS)
# run manually, or from the build/release console and build/release all workflows
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-msdos
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/volkertb/debian-djgpp
    steps:
      - uses: actions/checkout@v5
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get -y install curl

      - name: Compile MS dos build
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\\\"${GITHUB_SHA::9}\\\"
          make dos CC=gcc EXTRA_CFLAGS="$LATEST_FLAG"


      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'CCDOS.EXE'
          DEST_NAME: 'ClassiCube.exe'
          
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'msdos'


      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce MS DOS build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
