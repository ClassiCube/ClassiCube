name: Build latest (GameCube)
# run manually, or from the build/release console and build/release all workflows
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-gc
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile GameCube build
        shell: bash
        run: |
          LATEST_FLAG=-DCC_COMMIT_SHA=\\\"${GITHUB_SHA::9}\\\"
          make gamecube EXTRA_CFLAGS="$LATEST_FLAG"
          
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-gc.dol'
          DEST_NAME: 'ClassiCube-gc.dol'
          
      - uses: ./.github/actions/upload_build
        with:
          SOURCE_FILE: 'ClassiCube-gc.elf'
          DEST_NAME: 'ClassiCube-gc.elf'
          
          
      - uses: ./.github/actions/notify_success
        with:
          DESTINATION_URL: '${{ secrets.NOTIFY_URL }}'
          WORKFLOW_NAME: 'gc'


      - uses: ./.github/actions/notify_failure
        if: failure()
        with:
          NOTIFY_MESSAGE: 'Failed to produce GameCube build'
          WEBHOOK_URL: '${{ secrets.WEBHOOK_URL }}'
